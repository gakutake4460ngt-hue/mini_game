<title>宵の蛍狩り</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@600;900&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: 一画面の夜の水辺。上に細い計器帯、残りすべてが網を描く田んぼの上空。単一テーマ(夜) */
:root {
  --night: #0a0f24;
  --night-2: #141b3d;
  --ink: #e8ebf6;
  --muted: #8d95bd;
  --glow: #f3e889;
  --net: #b4cdff;
  --moth: #a597c4;
  --warn: #ff9a8a;
  --display: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--night); color: var(--ink); font-family: var(--body);
  overflow: hidden; -webkit-user-select: none; user-select: none;
}
.app {
  height: 100%; display: flex; flex-direction: column; gap: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 16px; box-sizing: border-box;
}
.hud { display: flex; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
.hud h1 {
  font-family: var(--display); font-weight: 900; font-size: 1.5rem; margin: 0;
  letter-spacing: .08em; margin-right: auto; text-wrap: balance;
}
.hud h1 small { font-family: var(--body); font-weight: 400; font-size: .7rem; color: var(--muted); letter-spacing: .15em; margin-left: 8px; }
.stat { display: flex; flex-direction: column; gap: 2px; min-width: 3.5em; }
.stat .k { font-size: .65rem; letter-spacing: .2em; color: var(--muted); }
.stat .v { font-family: var(--display); font-size: 1.35rem; font-variant-numeric: tabular-nums; line-height: 1; }
.stat .v.low { color: var(--warn); }
.icon-btn {
  background: transparent; color: var(--muted); border: 1px solid color-mix(in srgb, var(--muted) 40%, transparent);
  border-radius: 999px; font: inherit; font-size: .75rem; padding: 6px 12px; cursor: pointer;
}
.icon-btn:focus-visible, .cta:focus-visible { outline: 2px solid var(--glow); outline-offset: 3px; }
.timebar { height: 2px; background: color-mix(in srgb, var(--muted) 25%, transparent); border-radius: 2px; overflow: hidden; }
.timebar i { display: block; height: 100%; width: 100%; background: var(--glow); transform-origin: left; }
.stage { position: relative; flex: 1; min-height: 0; border-radius: 6px; overflow: hidden; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; display: block; }
.overlay {
  position: absolute; inset: 0; display: grid; place-items: center; padding: 16px;
  background: color-mix(in srgb, var(--night) 55%, transparent);
}
.card { max-width: 30rem; display: flex; flex-direction: column; gap: 14px; text-align: left; }
.card h2 { font-family: var(--display); font-weight: 900; font-size: clamp(2rem, 7vw, 3.2rem); margin: 0; letter-spacing: .06em; line-height: 1.15; text-wrap: balance; }
.card p { margin: 0; line-height: 1.8; color: var(--ink); font-size: .95rem; }
.rules { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: .88rem; line-height: 1.6; margin: 0; }
.rules dt { color: var(--glow); font-weight: 700; }
.rules dt.m { color: var(--moth); }
.rules dd { margin: 0; color: var(--ink); }
.cta {
  align-self: flex-start; font-family: var(--display); font-weight: 900; font-size: 1.1rem; letter-spacing: .2em;
  background: var(--glow); color: var(--night); border: 0; border-radius: 2px; padding: 12px 28px; cursor: pointer;
  box-shadow: 0 0 28px color-mix(in srgb, var(--glow) 45%, transparent);
}
.result { display: flex; gap: 24px; flex-wrap: wrap; }
.result .stat .v { font-size: 1.8rem; }
.rank { font-family: var(--display); color: var(--glow); font-size: 1.2rem; letter-spacing: .1em; }
.note { color: var(--muted); font-size: .78rem; }
</style>

<div class="app">
  <div class="hud">
    <h1>宵の蛍狩り<small>HOTARU-GARI</small></h1>
    <div class="stat"><span class="k">得点</span><span class="v" id="score">0</span></div>
    <div class="stat"><span class="k">残り</span><span class="v" id="time">60</span></div>
    <div class="stat"><span class="k">自己ベスト</span><span class="v" id="best">0</span></div>
    <button class="icon-btn" id="mute" type="button">音 ON</button>
  </div>
  <div class="timebar"><i id="bar"></i></div>
  <div class="stage" id="stage">
    <canvas id="field"></canvas>
    <div class="overlay" id="title">
      <div class="card">
        <h2>網で囲んで、<br>光る蛍をつかまえる。</h2>
        <dl class="rules">
          <dt>囲む</dt><dd>指かマウスで線を引き、輪を閉じると中の蛍がつかまる。</dd>
          <dt>光るときだけ</dt><dd>点滅の消えている蛍は、囲んでも逃げてしまう。</dd>
          <dt>まとめて</dt><dd>一度に n 匹で n 倍。大きな輪ほど得点が跳ね上がる。</dd>
          <dt>金の蛍</dt><dd>5 点ぶん。点滅が速いので狙いどき。</dd>
          <dt class="m">蛾</dt><dd>輪に入れるとその輪は失敗、残り時間が 3 秒減る。</dd>
        </dl>
        <p class="note">網の長さには限りがある。持ち時間は 60 秒。</p>
        <button class="cta" id="start" type="button">はじめる</button>
      </div>
    </div>
    <div class="overlay" id="over" hidden>
      <div class="card">
        <h2>夜が明けた</h2>
        <div class="rank" id="rank"></div>
        <div class="result">
          <div class="stat"><span class="k">得点</span><span class="v" id="r-score">0</span></div>
          <div class="stat"><span class="k">つかまえた蛍</span><span class="v" id="r-count">0</span></div>
          <div class="stat"><span class="k">最大の輪</span><span class="v" id="r-max">0</span></div>
        </div>
        <p class="note" id="r-best"></p>
        <button class="cta" id="again" type="button">もう一夜</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
const cv = document.getElementById('field'), ctx = cv.getContext('2d');
const stage = document.getElementById('stage');
const $ = id => document.getElementById(id);
const ROUND = 60, FIREFLY_N = 26;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

let W = 0, H = 0, DPR = 1, bg = null;
let fireflies = [], moths = [], loops = [], texts = [], sparks = [];
let path = null, drawing = false;
let phase = 'title', timeLeft = ROUND, elapsed = 0, score = 0, caughtTotal = 0, maxLoop = 0;
let best = 0;
try { best = +localStorage.getItem('hotaru-best') || 0; } catch (e) {}
$('best').textContent = best;

const rand = (a, b) => a + Math.random() * (b - a);
const maxLen = () => Math.max(520, (W + H) * 0.75);

/* ---------- 背景 ---------- */
function buildBg() {
  bg = document.createElement('canvas');
  bg.width = W * DPR; bg.height = H * DPR;
  const g = bg.getContext('2d'); g.scale(DPR, DPR);
  const sky = g.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#060a1c'); sky.addColorStop(.7, '#121a3e'); sky.addColorStop(1, '#1a2347');
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  for (let i = 0; i < W * H / 5000; i++) {
    g.fillStyle = `rgba(220,226,255,${rand(.15, .6)})`;
    g.fillRect(rand(0, W), rand(0, H * .55), rand(.6, 1.6), rand(.6, 1.6));
  }
  const mx = W * .82, my = H * .16, mr = Math.min(W, H) * .05 + 8;
  const halo = g.createRadialGradient(mx, my, mr, mx, my, mr * 5);
  halo.addColorStop(0, 'rgba(240,236,210,.18)'); halo.addColorStop(1, 'rgba(240,236,210,0)');
  g.fillStyle = halo; g.fillRect(0, 0, W, H);
  g.fillStyle = '#efeacd'; g.beginPath(); g.arc(mx, my, mr, 0, 7); g.fill();
  // 水面
  const wy = H * .82;
  g.fillStyle = '#0d1430'; g.fillRect(0, wy, W, H - wy);
  g.strokeStyle = 'rgba(239,234,205,.12)';
  for (let i = 0; i < 9; i++) { const y = wy + 6 + i * 7; g.beginPath(); g.moveTo(mx - 40 + rand(-10, 10), y); g.lineTo(mx + 40 + rand(-10, 10), y); g.stroke(); }
  // 葦
  g.strokeStyle = '#050816'; g.lineCap = 'round';
  for (let i = 0; i < W / 9; i++) {
    const x = rand(-10, W + 10), h = rand(H * .08, H * .3), lean = rand(-30, 30);
    g.lineWidth = rand(1.2, 3);
    g.beginPath(); g.moveTo(x, H); g.quadraticCurveTo(x + lean * .3, H - h * .6, x + lean, H - h); g.stroke();
  }
}
function resize() {
  const r = stage.getBoundingClientRect();
  DPR = Math.min(2, devicePixelRatio || 1); W = r.width; H = r.height;
  cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildBg();
}
new ResizeObserver(resize).observe(stage);
resize();

/* ---------- 生き物 ---------- */
function spawnFirefly(x, y) {
  const gold = Math.random() < .07;
  fireflies.push({
    x: x ?? rand(20, W - 20), y: y ?? rand(20, H * .85), a: rand(0, 7), sp: rand(18, 42),
    period: gold ? rand(1.1, 1.5) : rand(2.2, 3.8), ph: rand(0, 7), gold, born: 0, flee: 0, fx: 0, fy: 0, b: 0
  });
}
function spawnMoth() {
  const side = Math.random() < .5;
  moths.push({ x: side ? -20 : W + 20, y: rand(30, H * .75), a: side ? 0 : Math.PI, sp: rand(35, 60), ph: rand(0, 7) });
}
function populate() {
  fireflies = []; moths = [];
  for (let i = 0; i < FIREFLY_N; i++) { spawnFirefly(); fireflies[i].born = 1; }
  for (let i = 0; i < 2; i++) { spawnMoth(); moths[i].x = rand(40, W - 40); }
}
populate();

/* ---------- 音 ---------- */
let ac = null, muted = false;
const SCALE = [523, 587, 659, 784, 880, 1047, 1175, 1319, 1568, 1760, 2093];
function tone(f, t0 = 0, dur = .4, vol = .07, type = 'sine') {
  if (!ac || muted) return;
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + t0;
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + .05);
}
$('mute').onclick = () => { muted = !muted; $('mute').textContent = muted ? '音 OFF' : '音 ON'; };

/* ---------- 幾何 ---------- */
function segInt(p1, p2, p3, p4) {
  const d = (p2.x - p1.x) * (p4.y - p3.y) - (p2.y - p1.y) * (p4.x - p3.x);
  if (Math.abs(d) < 1e-9) return null;
  const t = ((p3.x - p1.x) * (p4.y - p3.y) - (p3.y - p1.y) * (p4.x - p3.x)) / d;
  const u = ((p3.x - p1.x) * (p2.y - p1.y) - (p3.y - p1.y) * (p2.x - p1.x)) / d;
  return t > 0 && t < 1 && u > 0 && u < 1 ? { x: p1.x + t * (p2.x - p1.x), y: p1.y + t * (p2.y - p1.y) } : null;
}
function inside(pt, poly) {
  let c = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const a = poly[i], b = poly[j];
    if ((a.y > pt.y) !== (b.y > pt.y) && pt.x < (b.x - a.x) * (pt.y - a.y) / (b.y - a.y) + a.x) c = !c;
  }
  return c;
}
function area(poly) {
  let s = 0;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) s += (poly[j].x + poly[i].x) * (poly[j].y - poly[i].y);
  return Math.abs(s / 2);
}
function centroid(poly) {
  let x = 0, y = 0; poly.forEach(p => { x += p.x; y += p.y; });
  return { x: x / poly.length, y: y / poly.length };
}

/* ---------- 網 ---------- */
function newPath(x, y) { path = { pts: [{ x, y }], len: 0, life: 1 }; drawing = true; }
function addPoint(x, y) {
  const p = path.pts, last = p[p.length - 1];
  const d = Math.hypot(x - last.x, y - last.y);
  if (d < 5) return;
  const np = { x, y };
  for (let i = 0; i < p.length - 3; i++) {
    const ip = segInt(p[i], p[i + 1], last, np);
    if (ip) { const poly = p.slice(i + 1); poly.push(ip); closeLoop(poly); newPath(x, y); return; }
  }
  p.push(np); path.len += d;
  if (path.len > maxLen()) {
    texts.push({ x, y: y - 16, s: '網が尽きた', c: '#8d95bd', life: 1 });
    drawing = false;
  }
}
function scatter(f, cx, cy) {
  const a = Math.atan2(f.y - cy, f.x - cx);
  f.flee = 1; f.fx = Math.cos(a) * 160; f.fy = Math.sin(a) * 160; f.a = a;
}
function closeLoop(poly) {
  if (poly.length < 4 || area(poly) < 500) return;
  const c = centroid(poly);
  const mothIn = moths.some(m => inside(m, poly));
  const inF = fireflies.filter(f => inside(f, poly));
  if (mothIn) {
    inF.forEach(f => scatter(f, c.x, c.y));
    timeLeft = Math.max(0, timeLeft - 3);
    loops.push({ poly, life: 1, c: '255,154,138' });
    texts.push({ x: c.x, y: c.y, s: '蛾が入った −3秒', c: '#ff9a8a', life: 1.3 });
    tone(196, 0, .5, .08, 'triangle'); tone(147, .08, .6, .08, 'triangle');
    return;
  }
  const got = inF.filter(f => f.b > .35 && f.born > .6);
  inF.filter(f => !got.includes(f)).forEach(f => scatter(f, c.x, c.y));
  if (!got.length) {
    loops.push({ poly, life: .6, c: '141,149,189' });
    texts.push({ x: c.x, y: c.y, s: inF.length ? '光っていない…' : '空振り', c: '#8d95bd', life: 1 });
    return;
  }
  const n = got.length, base = got.reduce((s, f) => s + (f.gold ? 5 : 1), 0), pts = base * n;
  score += pts; caughtTotal += n; maxLoop = Math.max(maxLoop, n);
  fireflies = fireflies.filter(f => !got.includes(f));
  got.forEach(f => { for (let k = 0; k < 6; k++) sparks.push({ x: f.x, y: f.y, vx: rand(-40, 40), vy: rand(-90, -20), life: 1, gold: f.gold }); });
  loops.push({ poly, life: 1, c: '243,232,137' });
  texts.push({ x: c.x, y: c.y, s: n > 1 ? `+${pts}  (${n}匹 ×${n})` : `+${pts}`, c: '#f3e889', life: 1.3, big: n >= 4 });
  for (let i = 0; i < Math.min(n, 8); i++) tone(SCALE[Math.min(SCALE.length - 1, i + Math.floor(n / 3))], i * .07, .5, .06);
  if (got.some(f => f.gold)) tone(2637, n * .07, .7, .04);
  $('score').textContent = score;
}

function pos(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
cv.addEventListener('pointerdown', e => {
  if (phase !== 'play') return;
  cv.setPointerCapture(e.pointerId);
  const p = pos(e); newPath(p.x, p.y);
});
cv.addEventListener('pointermove', e => {
  if (!drawing || phase !== 'play') return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of evs) { if (!drawing) break; const p = pos(ev); addPoint(p.x, p.y); }
});
const endStroke = () => {
  if (!drawing) return;
  drawing = false;
  const p = path.pts;
  if (p.length > 8 && Math.hypot(p[0].x - p[p.length - 1].x, p[0].y - p[p.length - 1].y) < 40) { closeLoop(p.slice()); path = null; }
};
cv.addEventListener('pointerup', endStroke);
cv.addEventListener('pointercancel', endStroke);

/* ---------- 進行 ---------- */
function start() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  ac?.resume?.();
  phase = 'play'; timeLeft = ROUND; elapsed = 0; score = 0; caughtTotal = 0; maxLoop = 0;
  loops = []; texts = []; sparks = []; path = null; drawing = false;
  populate();
  $('score').textContent = 0; $('title').hidden = true; $('over').hidden = true;
  tone(784, 0, .4); tone(1047, .12, .6);
}
function finish() {
  phase = 'over'; drawing = false;
  const isBest = score > best;
  if (isBest) { best = score; try { localStorage.setItem('hotaru-best', best); } catch (e) {} }
  $('best').textContent = best;
  $('r-score').textContent = score; $('r-count').textContent = caughtTotal; $('r-max').textContent = maxLoop + '匹';
  $('rank').textContent = score < 30 ? '称号 ― 見習いの網' : score < 100 ? '称号 ― 夕涼みの人' : score < 250 ? '称号 ― 蛍名人' : '称号 ― 宵の主';
  $('r-best').textContent = isBest ? '自己ベストを更新した。' : `自己ベストは ${best} 点。`;
  $('over').hidden = false;
  tone(659, 0, .6); tone(523, .15, .8);
}
$('start').onclick = start;
$('again').onclick = start;

let last = performance.now(), T = 0;
function step(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; T += dt;
  if (phase === 'play') {
    timeLeft -= dt; elapsed += dt;
    if (timeLeft <= 0) { timeLeft = 0; finish(); }
    const want = Math.min(5, 2 + Math.floor(elapsed / 15));
    if (moths.length < want) spawnMoth();
  }
  while (fireflies.length < FIREFLY_N) spawnFirefly();
  update(dt); draw();
  $('time').textContent = Math.ceil(timeLeft);
  $('time').classList.toggle('low', timeLeft <= 10 && phase === 'play');
  $('bar').style.transform = `scaleX(${timeLeft / ROUND})`;
  requestAnimationFrame(step);
}

function update(dt) {
  for (const f of fireflies) {
    f.born = Math.min(1, f.born + dt);
    f.a += rand(-2.2, 2.2) * dt;
    let vx = Math.cos(f.a) * f.sp, vy = Math.sin(f.a) * f.sp * .7;
    if (f.flee > 0) { vx += f.fx * f.flee; vy += f.fy * f.flee; f.flee = Math.max(0, f.flee - dt * 1.2); }
    f.x += vx * dt; f.y += vy * dt;
    if (f.x < 12) f.a = 0; if (f.x > W - 12) f.a = Math.PI;
    if (f.y < 12) f.a = Math.PI / 2; if (f.y > H * .9) f.a = -Math.PI / 2;
    f.x = Math.max(4, Math.min(W - 4, f.x)); f.y = Math.max(4, Math.min(H - 4, f.y));
    const s = Math.sin(T * 2 * Math.PI / f.period + f.ph);
    f.b = Math.pow(Math.max(0, s), .6) * f.born;
  }
  for (const m of moths) {
    m.a += Math.sin(T * 1.3 + m.ph) * .9 * dt;
    m.x += Math.cos(m.a) * m.sp * dt; m.y += (Math.sin(m.a) * m.sp + Math.sin(T * 5 + m.ph) * 30) * dt;
    if (m.x < -30) m.a = 0; if (m.x > W + 30) m.a = Math.PI;
    if (m.y < 20) m.a = .6; if (m.y > H * .8) m.a = -.6;
  }
  loops.forEach(l => l.life -= dt * 1.4); loops = loops.filter(l => l.life > 0);
  texts.forEach(t => { t.life -= dt * .8; t.y -= 22 * dt; }); texts = texts.filter(t => t.life > 0);
  sparks.forEach(s => { s.x += s.vx * dt; s.y += s.vy * dt; s.vy -= 30 * dt; s.life -= dt * 1.1; }); sparks = sparks.filter(s => s.life > 0);
  if (path && !drawing) { path.life -= dt * 2.5; if (path.life <= 0) path = null; }
}

function draw() {
  if (bg) ctx.drawImage(bg, 0, 0, W, H);
  // 蛾
  for (const m of moths) {
    const flap = reduce ? .8 : .35 + Math.abs(Math.sin(T * 14 + m.ph)) * .65;
    ctx.save(); ctx.translate(m.x, m.y); ctx.rotate(Math.cos(m.a) < 0 ? .15 : -.15);
    ctx.fillStyle = 'rgba(165,151,196,.85)';
    for (const sx of [-1, 1]) {
      ctx.beginPath(); ctx.ellipse(sx * 9 * flap, -2, 10 * flap, 8, sx * .5, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(sx * 6 * flap, 6, 6 * flap, 5, -sx * .4, 0, 7); ctx.fill();
    }
    ctx.fillStyle = '#3a3352'; ctx.beginPath(); ctx.ellipse(0, 1, 2.5, 8, 0, 0, 7); ctx.fill();
    ctx.restore();
  }
  // 蛍
  ctx.globalCompositeOperation = 'lighter';
  for (const f of fireflies) {
    const col = f.gold ? '255,190,80' : '214,240,120';
    if (f.b > .02) {
      const r = 6 + f.b * (f.gold ? 26 : 20);
      const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, r);
      g.addColorStop(0, `rgba(${col},${.9 * f.b})`); g.addColorStop(.3, `rgba(${col},${.35 * f.b})`); g.addColorStop(1, `rgba(${col},0)`);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, 7); ctx.fill();
    }
    ctx.fillStyle = `rgba(255,250,210,${.18 + .82 * f.b})`;
    ctx.beginPath(); ctx.arc(f.x, f.y, 1.6 + f.b * 1.2, 0, 7); ctx.fill();
  }
  for (const s of sparks) {
    ctx.fillStyle = s.gold ? `rgba(255,200,90,${s.life})` : `rgba(230,245,150,${s.life})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, 1.8, 0, 7); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  // 閉じた輪
  for (const l of loops) {
    ctx.beginPath(); l.poly.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.closePath();
    ctx.fillStyle = `rgba(${l.c},${.12 * l.life})`; ctx.fill();
    ctx.strokeStyle = `rgba(${l.c},${.8 * l.life})`; ctx.lineWidth = 2; ctx.stroke();
  }
  // 描いている網
  if (path && path.pts.length > 1) {
    const used = Math.min(1, path.len / maxLen());
    const p = path.pts;
    ctx.lineJoin = ctx.lineCap = 'round';
    ctx.strokeStyle = used > .8 ? `rgba(255,154,138,${.9 * path.life})` : `rgba(180,205,255,${.85 * path.life})`;
    ctx.lineWidth = 2.5; ctx.setLineDash([7, 5]);
    ctx.beginPath(); p.forEach((q, i) => i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y)); ctx.stroke();
    ctx.setLineDash([]);
    if (drawing) {
      // 始点の目印と残りの網
      ctx.strokeStyle = 'rgba(180,205,255,.5)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(p[0].x, p[0].y, 40, 0, 7); ctx.stroke();
      const e = p[p.length - 1];
      ctx.strokeStyle = 'rgba(180,205,255,.9)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(e.x, e.y, 14, -Math.PI / 2, -Math.PI / 2 + (1 - used) * Math.PI * 2); ctx.stroke();
    }
  }
  // 文字
  ctx.textAlign = 'center';
  for (const t of texts) {
    ctx.font = `900 ${t.big ? 26 : 18}px "Zen Old Mincho", serif`;
    ctx.fillStyle = t.c; ctx.globalAlpha = Math.min(1, t.life);
    ctx.fillText(t.s, t.x, t.y);
  }
  ctx.globalAlpha = 1;
}
requestAnimationFrame(step);
})();
</script>
